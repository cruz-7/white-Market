name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Frontend checks
        run: npm run check
        working-directory: frontend

      - name: Production build configuration check
        run: npm run build
        working-directory: frontend
        env:
          CONVEX_DEPLOYMENT: prod:ci-validation
          VITE_CONVEX_URL: https://ci-validation.convex.cloud
          VITE_CONVEX_SITE_URL: https://ci-validation.convex.site
          VITE_PAYSTACK_PUBLIC_KEY: pk_live_ci_validation

      - name: Backend checks
        run: npm run check
        working-directory: backend
